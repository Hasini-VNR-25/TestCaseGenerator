# Application Configuration
spring.application.name=Intelligent-Java-Test-Case-Generator
server.port=8080

# Database Configuration (Embedded H2 for zero-setup execution)
# To switch to MySQL, uncomment the MySQL lines below and enter your local MySQL password.
spring.datasource.url=jdbc:h2:file:./data/testgen_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Native H2 Web Console (accessible directly outside custom UI)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# MySQL Configuration (Uncomment if using MySQL Server)
# spring.datasource.url=jdbc:mysql://localhost:3306/testgen_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf & Web
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.cbp.testgen=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
